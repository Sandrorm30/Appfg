<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c4f7a">
<title>Sem conexão</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f7;font-family:Arial,sans-serif;padding:24px}
.card{width:min(100%,420px);background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 28px rgba(15,48,72,.12);text-align:center}
.icon{width:58px;height:58px;margin:0 auto 14px;border-radius:16px;background:#0c4f7a;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900}
h1{font-size:21px;margin:0 0 10px}p{font-size:14px;line-height:1.5;color:#66717b;margin:0}
</style>
</head>
<body>
<div class="card">
<div class="icon">F</div>
<h1>Você está sem conexão</h1>
<p>A interface pode abrir em cache, mas a sincronização com a planilha exige internet.</p>
</div>
</body>
</html>
